version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: brand_envoy_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: brand_envoy_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brand_envoy_php_api
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: brand_envoy_db
      DB_USER: root
      DB_PASS: rootpassword
      CORS_ORIGIN: "*"
    volumes:
      - ./backend:/var/www/html
      - ./.env:/var/www/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
